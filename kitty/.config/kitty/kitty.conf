text_composition_strategy 0.5 15
font_size 20
modify_font underline_position 3.9
modify_font underline_thickness 30%
modify_font strikethrough_position 8px
undercurl_style thin-sparse
adjust_baseline 2

symbol_map U+E0A0-U+E0A3,U+E0C0-U+E0C7 PowerlineSymbols
# 
symbol_map U+E0a0 Symbols Nerd Font
# [✗]
symbol_map U+2717 nonicon
# aws 󰸏
# symbol_map U+DB83-UDE0F Symbols Nerd Font
symbol_map U+DB83 Symbols Nerd Font
symbol_map U+E5FA-U+E62B Symbols Nerd Font
# Devicons
symbol_map U+E700-U+E7C5 Symbols Nerd Font
# Font Awesome
symbol_map U+F000-U+F2E0 Symbols Nerd Font
# Font Awesome Extension
symbol_map U+E200-U+E2A9 Symbols Nerd Font
# Material Design Icons
symbol_map U+F500-U+FD46 Symbols Nerd Font
# Weather
symbol_map U+E300-U+E3EB Symbols Nerd Font
# Octicons
symbol_map U+F400-U+F4A8,U+2665,U+26A1,U+F27C Symbols Nerd Font
# Powerline Extra Symbols
symbol_map U+E0A3,U+E0B4-U+E0C8,U+E0CC-U+E0D2,U+E0D4 Symbols Nerd Font
# IEC Power Symbols
symbol_map U+23FB-U+23FE,U+2b58 Symbols Nerd Font
# Font Logos
symbol_map U+F300-U+F313 Symbols Nerd Font
# Pomicons
symbol_map U+E000-U+E00D Symbols Nerd Font
# Codicons
symbol_map U+EA60-U+EBEB Symbols Nerd Font Mono
# iconmoon
symbol_map U+1f300 icomoon
# []
symbol_map U+E718 Symbols Nerd Font
symbol_map U+D000-U+D21A termicons

narrow_symbols U+f489 1
narrow_symbols U+d157 1
narrow_symbols U+f0da 1
narrow_symbols U+f48c,U+f4da,U+f42d 1
narrow_symbols U+F111,U+25cf 1
narrow_symbols U+D000-U+D21A 1
narrow_symbols U+d1a1 1
narrow_symbols U+D040 1
# 
narrow_symbols U+F474 1

cursor #FAAFAF
cursor_text_color #111111
cursor_shape block
cursor_blink_interval 0.5

scrollback_pager nvim --cmd 'set eventignore=FileType' +'nnoremap q ZQ' +'call nvim_open_term(0, {})' +'set nomodified nolist' +'$' -
mouse_hide_wait 0.1


remember_window_size no
initial_window_width  155c
initial_window_height 40c

window_border_width 1px
draw_minimal_borders yes
window_margin_width 0

hide_window_decorations titlebar-only

confirm_os_window_close 0
background_opacity 0.90
background_blur 20
dynamic_background_opacity yes
background_tint 0.92

allow_remote_control yes
# Socket for kitten @, needed by scripts (kitty-session-switcher) and their
# child processes. kitty appends -<pid> to the path. Requires a restart,
# this option cannot be reloaded.
listen_on unix:/tmp/kitty
# Programs launched by kitty (key bindings, session files) do not go through a
# shell, so they inherit kitty's environment. Started from Finder/Dock/open -a,
# kitty gets launchd's minimal PATH (/usr/bin:/bin:/usr/sbin:/sbin) and scripts
# cannot find fzf, nvim, etc. Read PATH from the login shell at startup; the
# first line is the fallback, because that read has a 1.5s timeout and silently
# yields nothing when it fails. Read once at startup, not on config reload, so
# restart kitty after changing it.
env PATH=$HOME/.config/bin:/opt/homebrew/bin:/usr/local/bin:$HOME/.local/bin:${PATH}
env read_from_shell=PATH
# kitty reloads the config automatically 0.1s after a change. With this setup
# that reload also fires shortly after a font size change, resetting the zoom,
# so disable it and reload explicitly with cmd+shift+r (see the maps below).
# This option is only read at startup; restart kitty after changing it.
auto_reload_config -1
# Restore OS windows, tabs and scrollback after logging out, rebooting or
# shutting down the computer. Does not cover quitting kitty manually.
restore_session_after_logout no

#: Enable shell integration on supported shells. This enables features
#: such as jumping to previous prompts, browsing the output of the
#: previous command in a pager, etc. on supported shells. Set to
#: disabled to turn off shell integration, completely. It is also
#: possible to disable individual features, set to a space separated
#: list of these values: no-rc, no-cursor, no-title, no-cwd, no-
#: prompt-mark, no-complete. See Shell integration
#: <https://sw.kovidgoyal.net/kitty/shell-integration/> for details.
shell_integration enabled

macos_option_as_alt no

macos_show_window_title_in none
macos_menubar_title_max_length 0

window_margin_width 0
single_window_margin_width 0
window_padding_width 8 0 0 10

tab_bar_min_tabs 1

tab_bar_filter session:~ or session:^$
tab_title_template "{session_name or active_session_name or title}"



adjust_line_height  0
adjust_column_width 0
font_size 26

# BEGIN_KITTY_FONTS
font_family      family="Meslo LG S"
bold_font        auto
italic_font      auto
bold_italic_font auto
# END_KITTY_FONTS


########################################### MAPPINGS

# Disable secure keyboard entry shortcut (interferes with skhd)
map opt+cmd+s no_op
map cmd+k no_op
map cmd+m no_op
map cmd+f no_op
map cmd+l no_op
map kitty_mod+h no_op
map kitty_mod+l no_op
map cmd+shift+h show_scrollback
map cmd+r no_op
map cmd+minus             change_font_size current -1.0
# Shift + Enter
# map shift+enter send_text all \x1b[13;2u
map shift+cmd+7 no_op
map shift+cmd+o no_op
map shift+cmd+i no_op

# send <M-e> mapped to yanky cycle history
# map shift+cmd+n send_text all \x1b\x65
# # send <M-r> mapped to yanky cycle history
# map shift+cmd+p send_text all \x1b\x72
# map shift+alt+p send_text all \x1bP
map shift+ctrl+left no_op
map shift+ctrl+right no_op

# send <M-lt> (lt = <) to nvim wich is mapped to C-S-Space
# map shift+ctrl+space send_text all \x1b\x3c
# <C-S-Space>

# map shift+cmd+/ send_text all \x1b\x67

# map shift+cmd+/ send_text all \x1b\x67
# map shift+cmd+/ alt+g
#
# map shift+cmd+7 send_text all :execute "\<M-g>"\r

# opacidad (el map de usuario gana sobre el default change_font_size)
map kitty_mod+minus set_background_opacity -0.1
map kitty_mod+plus  set_background_opacity +0.1
# libera Find/search_scrollback: macOS resuelve el atajo del menú ⌃⇧/
# contra la tecla física de "/" en US, que en Spanish ISO es la de "-"
map kitty_mod+/ no_op

# map cmd+enter send_text all \x01
map cmd+enter send_text all \x01



# map ctrl+shift+u no_op
map ctrl+shift+u send_text all \x1b[85;6u

map ctrl+i send_text all \x1b[105;5u
map ctrl+shift+i send_text all \x1b[73;6u
map ctrl+. send_text all \x1b[46;5u

# que tabs/ventanas nuevas se unan a la sesión activa
map cmd+t new_tab_with_cwd
map kitty_mod+enter new_window_with_cwd

# volver a la sesión anterior y guardar cambios en el fichero de la sesión
map f7>- goto_session -1
# map f5 save_as_session --relocatable --use-foreground-process --match=session:. .
map f5 save_as_session --relocatable --match=session:. .


map ctrl+, launch --type=tab --tab-title ' ' --allow-remote-control --env KITTY_SESSION_PICKER=1 kitty-session-switcher
# cmd+u: jump straight to the "new session from directory" picker (like ctrl+, then ctrl-n)
map cmd+u launch --type=tab --tab-title ' ' --allow-remote-control --env KITTY_SESSION_PICKER=1 kitty-session-switcher --new
# cmd+shift+d: close the current session and jump to the next one
map cmd+shift+d launch --type=tab --tab-title home --add-to-session=! --allow-remote-control sh -c 'cd "$HOME"; kitty-session-switcher --cycle-close || exec zsh'
# cmd+0: pick a project directory and cd the current shell to it (kitty-projects)
map cmd+0 send_text all kitty-projects\r


# atajos extra de opacidad (opcional; también están en ⌃⇧- / ⌃⇧+)
map ctrl+shift+0 set_background_opacity -0.1
map ctrl+shift+9 set_background_opacity +0.1

